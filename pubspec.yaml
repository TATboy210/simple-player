name: simple_player_flutter
description: "Simple Player - A dark-themed media player"
publish_to: 'none'
version: 1.0.0-rc.1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # media_kit 引擎 + 桌面控件 + Windows 原生库 (libmpv 二进制) — 唯一后端.
  # MediaKitEngine implements MediaEngine; Player.stream 事件流根治轮询滞后,
  # MaterialDesktopVideoControls 成熟 seekbar. fvp/MDK 已移除.
  media_kit: ^1.1.1
  media_kit_video: ^1.1.1
  media_kit_libs_windows_video: ^1.0.7
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  desktop_drop: ^0.7.1
  logger: ^2.5.0
  path: ^1.9.1
  crypto: ^3.0.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  ffi: ^2.1.0
  window_manager: ^0.5.2
  hotkey_manager: ^0.2.3
  file_selector: any
  xdg_directories: any
  animations: any
  cross_file: any
  

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^3.2.5
  build_runner: ^2.15.0
  pigeon: any
  msix: ^3.16.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600

msix_config:
  display_name: Simple Player
  publisher_display_name: Simple Player
  identity_name: com.simpleplayer.app
  msix_version: 1.0.0.1
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
