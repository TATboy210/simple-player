name: simple_player_flutter
description: "Simple Player - A dark-themed media player"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # media_kit 引擎 + 桌面控件 + Windows 原生库 (libmpv 二进制) — 唯一后端.
  # MediaKitEngine implements MediaEngine; Player.stream 事件流根治轮询滞后,
  # MaterialDesktopVideoControls 成熟 seekbar. fvp/MDK 已移除.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.7
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.2.1
  path_provider: ^2.1.6
  file_picker: ^11.0.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  desktop_drop: ^0.7.1
  logger: ^2.7.0
  path: ^1.9.1
  crypto: ^3.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  ffi: ^2.2.0
  window_manager: ^0.5.2
  # BB 同款双包: bitsdojo 接管边框/标题栏视觉(BDW_CUSTOM_FRAME), window_manager 管事件/状态
  bitsdojo_window: ^0.1.6
  # Debug-only VM service bridge for Marionette MCP UI automation.
  marionette_flutter: 0.6.0
  i18n: ^4.2.6
  xdg_directories: ^1.1.0
  animations: ^3.0.0
  cross_file: ^0.3.5+5
  intl: ^0.20.3
  get: ^4.7.3
  go_router: ^16.2.0
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^4.0.1
  build_runner: ^2.16.1
  pigeon: ^28.0.0
  msix: ^3.18.0
  fake_async: ^1.3.3
  lints: ^6.1.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600

msix_config:
  display_name: Simple Player
  publisher_display_name: Simple Player
  identity_name: com.simpleplayer.app
  msix_version: 0.0.1.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
