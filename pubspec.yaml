name: simple_player_flutter
description: "Simple Player - A dark-themed media player"
publish_to: 'none'
# pub accepts three-part SemVer only; 0.0.11 起停用 build 号,补丁轮以 0.0.12.1 形式映射 MSIX/display。
version: 0.0.12

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # mpv_kit (自研 libmpv 0.41 FFI 绑定) — 唯一后端; mpv_kit_video 重导出
  # mpv_kit 并经 mpv_kit_libs build hook 打包 libmpv (sha256 校验), runner 无需改动.
  # MpvKitEngine implements MediaEngine. media_kit 全家已移除 (2026-10).
  mpv_kit_video: ^0.1.0-dev.2
  path_provider: ^2.1.6
  # 不可升 12/13：file_picker 12+（federated 重构）→ windows_file_picker（全系）
  # 要求 win32 ^6.3.0，与 bitsdojo_window_windows 0.1.6 的 win32 ^5.1.1 区间不相交，
  # pub get 必然解析失败。解封条件：bitsdojo_window 支持 win32 6 后方可升级。
  # 届时须同步迁移 file_picker_adapters.dart 两处 12.x 破坏点
  #（lockParentWindow→WindowsOptions；pickFiles 返回非空 List，取消=空列表）。
  file_picker: ^11.0.3
  shared_preferences: ^2.5.6
  desktop_drop: ^0.8.4
  path: ^1.9.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  # 窗口方案(2026-09-06 用户裁决, BB 同款双包): bitsdojo(BDW_CUSTOM_FRAME
  # — 原生 NCCALCSIZE return 0 自绘标题栏形态 + WM_NCHITTEST 四边等宽
  # 缩放 + GETMINMAXINFO) + window_manager(事件/几何/关闭拦截/拖动)。
  # desktop_window/nativeapi 已移除。
  window_manager: ^0.5.2
  bitsdojo_window: ^0.1.6
  # SVG 渲染（关于页社交 logo：X/爱发电/Patreon/GitHub）
  flutter_svg: ^2.3.0
  # 视频缩略图（v0.0.5 Windows 槽位 — Media Foundation 解帧 + WIC 编码）
  flutter_video_thumbnail_plus: ^1.0.7
  # Debug-only VM service bridge for Marionette MCP UI automation.
  marionette_flutter: 0.7.0
  i18n: ^4.2.6
  xdg_directories: ^1.1.0
  cross_file: ^0.3.4
  intl: ^0.20.3
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  msix: ^3.18.0
  fake_async: ^1.3.3
  lints: ^6.1.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/

  fonts:
    - family: Noto Sans SC
      fonts:
        # 可变字体单文件（wght 100-900 轴）— FontWeight 按 wght 轴解析，
        # 替代三个静态字重（31.6MB → 17.8MB，且字体此前从未被主题引用）。
        - asset: assets/fonts/NotoSansSC-Variable.ttf

msix_config:
  display_name: Simple Player
  publisher_display_name: Simple Player
  identity_name: com.simpleplayer.app
  msix_version: 0.0.12.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
