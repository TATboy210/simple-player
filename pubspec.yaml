name: simple_player_flutter
description: "Simple Player - A dark-themed media player"
publish_to: 'none'
# pub accepts three-part SemVer only; 0.0.11 起停用 build 号,补丁轮以 0.0.12.1 形式映射 MSIX/display。
version: 0.0.12

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # mpv_kit (自研 libmpv 0.41 FFI 绑定) — 唯一后端; mpv_kit_video 重导出
  # mpv_kit 并经 mpv_kit_libs build hook 打包 libmpv (sha256 校验), runner 无需改动.
  # MpvKitEngine implements MediaEngine. media_kit 全家已移除 (2026-10).
  mpv_kit_video: ^0.1.0-dev.3
  path_provider: ^2.1.6
  # 13.x 解封（2026-10 window_frame_kit 迁移）：此前 bitsdojo_window_windows
  # 锁 win32 ^5.1.1，与 windows_file_picker 的 win32 ^6.3.0 不相交；window_frame_kit
  # 无 win32 Dart 依赖，冲突消失。12.x 两处破坏点已在 file_picker_adapters.dart
  # 迁移（lockParentWindow→平台 options；pickFiles 返回非空 List，取消=空列表）。
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  desktop_drop: ^0.8.4
  path: ^1.9.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  # 窗口方案(2026-10 迁移): window_frame_kit 单包 — window_manager 0.5.2
  # 全量 API 的超集(同名 windowManager 门面/WindowListener/WindowOptions)
  # + 原生自定义 frame(customFrame: 四边等宽缩放/无 Win10 主题色线/resize
  # 预同步防撕裂)。取代 bitsdojo(BDW_CUSTOM_FRAME) + window_manager 双包;
  # 两者都注册 WndProc delegate, 严禁与 window_manager 共存。
  window_frame_kit: ^0.3.0
  # SVG 渲染（关于页社交 logo：X/爱发电/Patreon/GitHub）
  flutter_svg: ^2.3.0
  # 视频缩略图（v0.0.5 Windows 槽位 — Media Foundation 解帧 + WIC 编码）
  flutter_video_thumbnail_plus: ^1.0.7
  # Debug-only VM service bridge for Marionette MCP UI automation.
  marionette_flutter: 0.7.0
  i18n: ^4.2.6
  xdg_directories: ^1.1.0
  cross_file: ^0.3.4
  intl: ^0.20.3
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  msix: ^3.18.0
  fake_async: ^1.3.3
  lints: ^6.1.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/

  fonts:
    - family: Noto Sans SC
      fonts:
        # 可变字体单文件（wght 100-900 轴）— FontWeight 按 wght 轴解析，
        # 替代三个静态字重（31.6MB → 17.8MB，且字体此前从未被主题引用）。
        - asset: assets/fonts/NotoSansSC-Variable.ttf

msix_config:
  display_name: Simple Player
  publisher_display_name: Simple Player
  identity_name: com.simpleplayer.app
  msix_version: 0.0.12.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
