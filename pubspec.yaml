name: simple_player_flutter
description: "Simple Player - A dark-themed media player"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  player_engine:
    path: ../widget_tree_flutter/player_engine
  fvp: ^0.37.2
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  desktop_drop: ^0.7.1
  logger: ^2.5.0
  path: ^1.9.1
  crypto: ^3.0.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  ffi: ^2.1.0
  window_manager: ^0.5.1
  hotkey_manager: ^0.2.3
  file_selector: any
  xdg_directories: any
  animations: any
  cross_file: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^3.2.5
  build_runner: ^2.15.0
  pigeon: any

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
