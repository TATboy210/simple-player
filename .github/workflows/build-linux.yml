name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev imagemagick

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build Linux
        run: flutter build linux --release

      - name: Generate icon PNGs from SVG
        run: |
          mkdir -p packaging/linux/icons/16x16
          mkdir -p packaging/linux/icons/32x32
          mkdir -p packaging/linux/icons/48x48
          mkdir -p packaging/linux/icons/64x64
          mkdir -p packaging/linux/icons/128x128
          mkdir -p packaging/linux/icons/256x256
          mkdir -p packaging/linux/icons/512x512
          for size in 16 32 48 64 128 256 512; do
            magick convert packaging/linux/icons/simple-player.svg -resize ${size}x${size} packaging/linux/icons/${size}x${size}/simple-player.png
          done

      - name: Package tar.gz
        run: |
          mkdir -p packaging_output
          cp -r build/linux/x64/release/bundle/* packaging_output/
          cp linux/simple-player.desktop packaging_output/
          cp packaging/linux/simple-player.sh packaging_output/
          cp packaging/linux/install-desktop.sh packaging_output/
          cp -r packaging/linux/icons packaging_output/
          chmod +x packaging_output/simple-player.sh
          chmod +x packaging_output/install-desktop.sh
          tar -czf SimplePlayer-linux-x64.tar.gz -C packaging_output .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimplePlayer-Linux
          path: SimplePlayer-linux-x64.tar.gz
          retention-days: 30
