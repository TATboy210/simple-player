name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Quality Gate: analyze + test on 3 platforms × x64/arm64 + build smoke
  # (ARM runner 免费 GA: windows-11-arm 2025-08, macos-latest 即 arm64
  # Apple Silicon, macos-15-intel 为 x64)
  #
  # 注: ubuntu-24.04-arm 不在矩阵 — Flutter stable 不发布 Linux ARM64
  # host SDK (releases_linux.json arm64 条目为 0, git 自举亦无
  # dart-sdk-linux-arm64.zip), 该平台无法运行 flutter test; Linux 测试
  # 覆盖由 ubuntu-latest (x64) 承担, arm 覆盖由 macOS arm64 + WoA 仿真
  # 的 windows-11-arm 承担。
  quality-gates:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- x86_64 三平台基线 ----
          - os: windows-latest
            platform: windows
            arch: x64
            build: true
            flutter-arch: x64
            git-source: false
          - os: macos-15-intel
            platform: macos
            arch: x64
            build: true
            flutter-arch: x64
            git-source: false
          - os: ubuntu-latest
            platform: linux
            arch: x64
            build: true
            flutter-arch: x64
            git-source: false
          # ---- arm64 两平台 ----
          - os: macos-latest
            platform: macos
            arch: arm64
            build: true
            flutter-arch: arm64
            git-source: false
          - os: windows-11-arm
            platform: windows
            arch: arm64
            # Flutter Windows arm64 target 仍 experimental — arm 机器上
            # 跑 x64 SDK 仿真执行测试门, build 门跳过 (首轮验证后放开)
            build: false
            flutter-arch: x64
            git-source: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # 固定版本: 三平台可复现; 3.47.6 是附带 Dart >=3.13.5 的最低
          # stable (3.47.0 只带 Dart 3.13.0, 不满足 pubspec ^3.13.5)
          flutter-version: 3.47.6
          architecture: ${{ matrix.flutter-arch }}
          git-source: ${{ matrix.git-source }}
          cache: true

      # Linux desktop build dependencies (clang/cmake/ninja/pkg-config/gtk3
      # + libmpv-dev — media_kit_video 的 CMake 经 pkg-config 找 mpv，
      # 缺开发头文件时 target_link_libraries 解析 PkgConfig::mpv 失败)
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libmpv-dev

      # Quality Gate 1: Static analysis (fatal-infos = treat info-level as errors)
      - name: Analyze
        run: flutter analyze --fatal-infos

      # Quality Gate 2: Unit + widget tests — 90s/用例 (默认 30s 对 WoA
      # x64 仿真的 windows-11-arm 过紧, 曾致 P-Thumb 时序组整组超时)
      - name: Test
        run: flutter test --timeout 90s

      # Quality Gate 3: Build smoke test (arm64 Windows 跳过, 见矩阵注释)
      - name: Build
        if: matrix.build
        run: flutter build ${{ matrix.platform }}
