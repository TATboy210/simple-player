name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Quality Gate: analyze + test + build on all 3 platforms
  quality-gates:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Linux desktop build dependencies (clang/cmake/ninja/pkg-config/gtk3
      # + libmpv-dev — media_kit_video 的 CMake 经 pkg-config 找 mpv，
      # 缺开发头文件时 target_link_libraries 解析 PkgConfig::mpv 失败)
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libmpv-dev

      # Quality Gate 1: Static analysis (fatal-infos = treat info-level as errors)
      - name: Analyze
        run: flutter analyze --fatal-infos

      # Quality Gate 2: Unit + widget tests
      - name: Test
        run: flutter test

      # Quality Gate 3: Build smoke test
      - name: Build
        run: flutter build ${{ matrix.platform }}
