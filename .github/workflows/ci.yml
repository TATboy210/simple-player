name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Quality Gate: analyze + test + build on all 3 platforms
  quality-gates:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Linux desktop build dependencies (clang/cmake/ninja/pkg-config/gtk3)
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      # Quality Gate 1: Static analysis (fatal-infos = treat info-level as errors)
      - name: Analyze
        run: flutter analyze --fatal-infos

      # Quality Gate 2: Unit + widget tests
      - name: Test
        run: flutter test

      # Quality Gate 3: Build smoke test
      - name: Build
        run: flutter build ${{ matrix.platform }}

  # Feature flag validation (Windows only — most complex platform)
  flag-matrix:
    runs-on: windows-latest
    strategy:
      matrix:
        flags:
          - ''  # default (USE_NEW_FULLSCREEN=false)
          - '--dart-define=USE_NEW_FULLSCREEN=true'
          - '--dart-define=USE_NEW_FULLSCREEN=true --dart-define=USE_WINDOWS_NATIVE_FULLSCREEN=true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Test with flags
        run: flutter test ${{ matrix.flags }}

      - name: Build with flags
        run: flutter build windows ${{ matrix.flags }}
